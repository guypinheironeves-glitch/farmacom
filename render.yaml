services:
  - type: web
    name: farmacom-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run db:preparar
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: farmacom-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
