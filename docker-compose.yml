services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmacom
      POSTGRES_PASSWORD: farmacom
      POSTGRES_DB: farmacom
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./server/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  dados:
